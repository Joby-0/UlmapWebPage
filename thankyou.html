<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tack - ULMAP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --ulmap-green: #1f5a2a;
            --ulmap-sand: #D6C4A1;
        }
        
        body {
            background-color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Branding Colors */
        .ulmap-green-text { color: var(--ulmap-green) !important; }
        .ulmap-green-bg { background-color: var(--ulmap-green) !important; }
        
        /* Layout */
        .page-content {
            flex: 1 0 auto;
            padding: 80px 0;
        }

        /* Thank You Section */
        .success-icon {
            width: 80px;
            height: 80px;
            background-color: var(--ulmap-green);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 2rem;
            box-shadow: 0 10px 20px rgba(31, 90, 42, 0.15);
        }

        .btn-ulmap {
            background-color: var(--ulmap-green);
            color: white;
            padding: 0.8rem 2.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            border: none;
        }
        .btn-ulmap:hover {
            background-color: #16401e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(31, 90, 42, 0.2);
        }

        footer {
            flex-shrink: 0;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <!-- Header Placeholder (Matches index.html structure) -->
    <header class="border-bottom py-3">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-center justify-content-md-between align-items-center">
                <a href="index.html" class="d-flex align-items-center mb-3 mb-md-0 link-body-emphasis text-decoration-none">
                    <span class="fs-4 fw-bold ulmap-green-text">ULMAP</span>
                </a>
                <ul class="nav nav-pills">
                    <li class="nav-item"><a href="index.html" class="nav-link text-dark">Hem</a></li>
                    <li class="nav-item"><a href="tjanster.html" class="nav-link text-dark">Tjänster</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link text-dark">Om oss</a></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="page-content d-flex align-items-center">
        <div class="container text-center">
            <div class="success-icon">
                ✓
            </div>
            <h1 class="display-3 fw-bold ulmap-green-text mb-3">Tack för ditt meddelande!</h1>
            <p class="lead text-muted mb-5 mx-auto" style="max-width: 600px;">
                Vi har tagit emot dina uppgifter och en av våra experter kommer att kontakta dig så snart som möjligt.
            </p>
            <div>
                <a href="index.html" class="btn-ulmap">
                    Tillbaka till startsidan
                </a>
            </div>
        </div>
    </main>

    <!-- Footer Placeholder (Matches index.html style) -->
    <footer class="py-4 border-top">
        <div class="container text-center">
            <p class="mb-0 text-muted">&copy; ULMAP AB. 2026</p>
        </div>
    </footer>

</body>
</html>
