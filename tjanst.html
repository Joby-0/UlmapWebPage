<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tjänst - ULMAP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        /* Shared Styles from about.html */
        .herodiv-small {
            height: 300px;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-bottom: 1px solid #dee2e6;
        }

        .service-content {
            padding: 5rem 0;
            line-height: 1.8;
        }

        .container {
            position: relative;
        }

        .spacer {
            height: 50px;
        }

        /* Additional styles to match index.html feel */
        .ulmap-green-text {
            color: #1f5a2a !important;
        }

        .ulmap-green-bg {
            background-color: #1f5a2a !important;
        }

        article img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .btn-outline-success {
            color: #1f5a2a;
            border-color: #1f5a2a;
        }

        .btn-outline-success:hover {
            background-color: #1f5a2a;
            border-color: #1f5a2a;
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="herodiv-small">
        <div class="container">
            <h1 id="service-title" class="display-4 fw-bold">Tjänster</h1>
            <p id="service-excerpt" class="lead">Laddar information...</p>
        </div>
    </div>

    <div class="service-content">
        <div class="container">
            <div id="service-info" class="service-info text-center">
                <div class="spinner-border text-success" role="status">
                    <span class="visually-hidden">Laddar...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const services = {
            "bocker-skrifter-for-barn": {
                title: "Informationsböcker och skrifter för barn",
                excerpt: "Anpassade informationsböcker och skrifter för barn och unga.",
                content: `
                    <p>
    Att förmedla kunskap till barn handlar om att väcka nyfikenhet och göra lärandet roligt.
    Därför producerar vi informationsböcker och skrifter som är anpassade för barn och unga,
    med ett språk och innehåll som engagerar och inspirerar.
</p>

<p>
    Vi skapar berättelser på rim, sagor och pedagogiska texter som gör det lättare att förstå
    allt från natur och miljö till historia, kultur och lokala sevärdheter. Genom fantasifulla
    berättelser och tydliga illustrationer blir informationen både lättillgänglig och minnesvärd.
</p>

<p>
    Varje bok eller skrift utformas efter målgrupp och syfte. Vi hjälper till med idé, research,
    textproduktion, illustration, layout och färdig produktion – alltid med fokus på att skapa
    ett material som barn tycker om att läsa och vuxna gärna använder i undervisning och verksamhet.
</p>

<p>
    Oavsett om ni vill ta fram en barnbok om ett naturreservat, en historisk plats, en kommun,
    ett museum eller ett besöksmål hjälper vi er att förvandla fakta till berättelser som
    inspirerar nästa generation att upptäcka, lära och utforska.
</p>
                `
            },
            "skyltar-informationsmaterial": {
                title: "Informationsskyltar och informationstavlor ",
                excerpt: "Tydlig information som håller över tid.",
                content: `
                    <section class="info-boards">
    <div class="container">
        <h1>Informationsskyltar &amp; Informationstavlor</h1>

        <p>
            Skapa en välkomnande och lättnavigerad miljö med informationsskyltar och
            informationstavlor som kombinerar funktion, kvalitet och design.
            Vi tillverkar skräddarsydda lösningar för kommuner, företag,
            bostadsrättsföreningar, naturreservat, turistmål, parker,
            industriområden och andra offentliga miljöer.
        </p>

        <p>
            Våra informationstavlor kan utformas med kartor, texter, bilder,
            symboler och logotyper för att ge besökare en tydlig överblick och
            vägledning. Oavsett om du behöver en orienteringskarta,
            områdesinformation, historisk information eller säkerhetsinstruktioner
            hjälper vi dig att ta fram en lösning som passar just ditt projekt.
        </p>

        <h2>Vi erbjuder</h2>

        <ul class="features-list">
            <li>Skräddarsydd design efter era önskemål.</li>
            <li>Högupplösta kartor och en tydlig, lättläst layout.</li>
            <li>UV-beständiga och väderbeständiga material för lång livslängd.</li>
            <li>Informationstavlor för både inom- och utomhusbruk.</li>
            <li>Flera storlekar, material och monteringsalternativ.</li>
        </ul>

        <h2>Från idé till färdig lösning</h2>

        <p>
            Vi hjälper dig genom hela processen – från idé och layout till färdig
            produktion. Med fokus på tydlig kommunikation, hållbara material och
            hög kvalitet skapar vi informationsskyltar som gör det enkelt för
            besökare att hitta rätt och ta del av viktig information.
        </p>

        <div class="cta-box">
            <h3>Begär en kostnadsfri offert</h3>
            <p>
                Kontakta oss gärna för att diskutera ditt projekt. Tillsammans
                skapar vi informationstavlor som är informativa, hållbara och
                estetiskt tilltalande.
            </p>

            <a href="/kontakt" class="btn btn-primary">
                Kontakta oss
            </a>
        </div>
    </div>
</section>
                `
            },
            "mark-och-anlaggning": {
                title: "Mark och anläggning",
                excerpt: "Professionell planering och utförande av mark- och anläggningsprojekt.",
                content: `
                    <h2 class="h3 mb-4">Digital strategi</h2>
                    <p>Vi hjälper dig att skapa en strategi som passar både kunder, målgrupp och affärsmål.</p>
                    <p>Från idé till genomförande fokuserar vi på resultat som faktiskt gör skillnad.</p>
                `
            }
        };

        function getServiceFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name') || urlParams.get('slug') || urlParams.get('id');

            if (!name) {
                return null;
            }

            const normalizedName = decodeURIComponent(name).trim().toLowerCase();
            return services[normalizedName] || null;
        }

        function renderService(service) {
            document.getElementById("service-title").innerHTML = service.title;
            document.title = `${service.title} - ULMAP`;

            document.getElementById("service-info").classList.remove('text-center');
            document.getElementById("service-info").innerHTML = `
                <article>
                    ${service.content}
                </article>
                <div class="mt-5 text-center">
                    <a href="tjanster.html" class="btn btn-outline-success">Tillbaka till alla tjänster</a>
                </div>
            `;

            document.getElementById("service-excerpt").innerText = service.excerpt;
        }

        function loadService() {
            const service = getServiceFromUrl();

            // if (!service) {
            //     window.location.href = "tjanster.html";
            //     return;
            // }

            renderService(service);
        }

        loadService();
    </script>
</body>

</html>
